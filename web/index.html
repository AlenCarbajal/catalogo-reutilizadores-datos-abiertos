<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="catalogo.titulo_pestana"></title>
<meta name="description" data-t-content="catalogo.descripcion_buscadores">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="cabecera">
  <div class="contenedor">
    <div class="cabecera__arriba">
      <div>
        <p class="kicker" data-t="catalogo.sobretitulo"></p>
        <h1 data-t="catalogo.titulo"></h1>
        <p class="bajada" data-t="catalogo.bajada"></p>
        <nav class="cabecera__enlaces" data-t-aria="catalogo.secciones">
          <a href="ecosistema.html"><span data-t="catalogo.ecosistema"></span> <span aria-hidden="true">→</span></a>
          <a href="acerca.html"><span data-t="catalogo.acerca"></span> <span aria-hidden="true">→</span></a>
        </nav>
      </div>
      <div class="mosaico" aria-hidden="true">
        <span class="indigo">↻</span><span>⇄</span><span class="violeta">{ }</span>
        <span class="violeta">@</span><span class="indigo">∞</span><span>•••</span>
      </div>
    </div>
    <div class="cabecera__abajo">
      <label class="buscador">
        <span data-t="catalogo.buscar"></span>
        <span class="buscador__campo">
          <span class="buscador__icono" aria-hidden="true">⌕</span>
          <input id="q" type="search" data-t-placeholder="catalogo.buscar_placeholder">
        </span>
      </label>
      <a class="boton boton--violeta" href="agregar.html"><span aria-hidden="true">+</span> <span data-t="catalogo.boton_sumar"></span></a>
    </div>
  </div>
</header>

<main class="contenedor disposicion">
  <aside aria-label="Filtros">
    <p class="rotulo" data-t="catalogo.filtrar"></p>
    <div id="filtros"></div>
  </aside>
  <section>
    <div class="barra"><p id="estado" role="status" aria-live="polite"></p><a class="barra__red" href="red.html"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 3M5 5l3 10M15 8l-7 7" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="5" cy="5" r="2.5"/><circle cx="15" cy="8" r="2.5"/><circle cx="8" cy="15" r="2.5"/></svg><span data-t="catalogo.ver_red"></span></a></div>
    <ol id="lista"></ol>
    <nav id="paginacion" class="paginacion" data-t-aria="pag.navegacion" hidden></nav>
    <div class="llamado">
      <div class="mosaico mosaico--chico" aria-hidden="true">
        <span class="navy">+</span><span>↻</span><span class="violeta">•••</span><span class="indigo">{ }</span>
      </div>
      <div>
        <p data-t="catalogo.llamado_titulo"></p>
        <p data-t="catalogo.llamado_texto"></p>
      </div>
      <a class="boton" href="agregar.html"><span data-t="catalogo.boton_sumar"></span> <span aria-hidden="true">→</span></a>
    </div>
  </section>
</main>

<footer class="pie">
  <div class="contenedor">
    <p data-t="catalogo.pie"></p>
  </div>
</footer>

<script src="config.js"></script>
<script src="textos.js"></script>
<script src="filtros.js"></script>
<script src="app.js"></script>
</body>
</html>
