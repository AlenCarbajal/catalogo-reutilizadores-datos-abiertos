<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="eco.titulo_pestana"></title>
<meta name="description" data-t-content="eco.bajada">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body class="eco">

<main>
  <section class="eco-escena" aria-labelledby="eco-titulo">
    <div class="eco-encabezado contenedor">
      <p><a class="volver" href="./" data-t="form.volver"></a></p>
      <h1 id="eco-titulo" data-t="eco.titulo"></h1>
      <p class="eco-bajada" data-t="eco.bajada"></p>
    </div>
    <div class="eco-controles contenedor">
      <button type="button" id="eco-volver" class="eco-volver" hidden><span aria-hidden="true">←</span> <span data-t="eco.volver"></span></button>
      <p id="eco-sistema-titulo" class="eco-sistema-titulo" aria-live="polite"></p>
    </div>
    <svg id="constelacion" data-t-aria="eco.titulo" role="group"></svg>
    <p class="eco-ayuda contenedor" data-t="eco.ayuda"></p>
    <aside id="eco-ficha" class="eco-ficha" hidden aria-live="polite">
      <button type="button" id="eco-cerrar" class="eco-ficha__cerrar" data-t-aria="red.cerrar"><span aria-hidden="true">×</span></button>
      <div id="eco-ficha-contenido"></div>
    </aside>
  </section>

  <section class="eco-listado contenedor" aria-labelledby="eco-lista-titulo">
    <h2 id="eco-lista-titulo" data-t="eco.lista_titulo"></h2>
    <ul class="eco-leyenda" data-t-aria="eco.leyenda">
      <li class="eco-estado eco-estado--online" data-t="eco.estado.online"></li>
      <li class="eco-estado eco-estado--offline" data-t="eco.estado.offline"></li>
      <li class="eco-estado eco-estado--instalable" data-t="eco.estado.instalable"></li>
    </ul>
    <div id="eco-lista" class="eco-lista"></div>
  </section>
</main>

<footer class="pie">
  <div class="contenedor">
    <p data-t="catalogo.pie"></p>
    <p><a href="acerca.html" data-t="catalogo.acerca"></a></p>
  </div>
</footer>

<script src="config.js"></script>
<script src="textos.js"></script>
<script src="ecosistema.js"></script>
</body>
</html>
