# Valida las fichas (items/*.yml) contra el schema en cada PR y en cada push.
# En main, además publica el sitio en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Catálogo

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/catalogo.py
      - run: python scripts/portales.py   # portales Andino activos para ecosistema.html
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Una publicación a la vez; no cancela validaciones de otras ramas o PRs.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
