tipo_organizacion: empresa
descripcion: >-
  Origen del registro: hoja Empresas (Uso dashboard). Reutilización confirmada. La documentación y las
  configuraciones de procesamiento identifican a Datos Argentina como fuente para los datos argentinos.
  Se emplearon los datasets de casos registrados y vacunación publicados en datos.gob.ar. Los datos argentinos
  fueron integrados y normalizados junto con fuentes de otros países. Es un proyecto histórico vinculado
  con la pandemia, no un servicio actualmente orientado a información en tiempo real.
