organizacion: Universidad de San Andrés
tipo_organizacion: academia
descripcion: >-
  Origen del registro: hoja Sociedad Civil ONG. Uso confirmado de infraestructura de Datos Argentina,
  específicamente Georef. El proyecto utiliza el servicio de normalización geográfica alojado en datos.gob.ar
  para obtener identificadores INDEC y nombres geográficos normalizados. No considero confirmado, en cambio,
  que los datos SEPA utilizados por el proyecto hayan sido obtenidos a través de datos.gob.ar.
