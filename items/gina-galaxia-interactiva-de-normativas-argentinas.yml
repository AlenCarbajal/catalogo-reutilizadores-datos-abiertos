id: gina-galaxia-interactiva-de-normativas-argentinas
nombre: GINA — Galaxia Interactiva de Normativas Argentinas
organizacion: BOA
tipo_organizacion: independiente
descripcion: >-
  Aplicación web que reutiliza la Base Infoleg de Normativa Nacional publicada en datos.gob.ar. Representa
  más de 400.000 normas mediante embeddings y reducción dimensional UMAP, y permite explorar similitudes,
  realizar búsquedas semánticas y filtrar por fecha y tipo de norma.
tipo_desarrollo:
- web
- visualizacion_datos
