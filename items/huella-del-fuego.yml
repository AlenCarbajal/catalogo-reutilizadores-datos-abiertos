descripcion: >-
  Origen del registro: hoja Sociedad Civil ONG. Uso confirmado de datos.gob.ar. La sección Acerca de enlaza
  expresamente a datos.gob.ar como fuente de las estadísticas del SNMF y de los datos SInIA. Combina esos
  registros con VIIRS/MODIS de NASA FIRMS; ofrece mapa histórico, análisis de impacto y causas, estimaciones
  de riesgo y monitoreo en tiempo real.
